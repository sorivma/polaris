[package]
name = "polaris"
version = "0.1.0"
edition = "2021"
description = "Cold War grand strategy game — code-centric, Rust-powered"
authors = ["sorivma"]
license = "MIT"
repository = "https://github.com/sorivma/polaris"

[dependencies]
# ── Rendering & Windowing ──────────────────────────
macroquad = "0.4"

# ── ECS (Entity Component System) ──────────────────
hecs = "0.11"

# ── Scripting / Modding ────────────────────────────
mlua = { version = "0.10", features = ["luajit", "vendored"] }

# ── UI (Immediate Mode) ────────────────────────────
egui-macroquad = "0.17"

# ── Serialization ──────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = "0.8"

# ── Math ───────────────────────────────────────────
glam = { version = "0.29", features = ["serde"] }

# ── Networking ─────────────────────────────────────
laminar = "0.5"

# ── Logging ────────────────────────────────────────
log = "0.4"
env_logger = "0.11"

# ── Dev / Testing ──────────────────────────────────
[dev-dependencies]
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
